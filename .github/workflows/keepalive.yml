name: keep-warm

# Render's free plan sleeps after ~15 minutes without inbound traffic, which
# wipes the backend's in-memory store (accounts, sessions, documents). This
# scheduled ping keeps the instance awake between visits.
#
# Note: GitHub may delay scheduled runs by several minutes under load, and it
# pauses schedules after ~60 days without repo activity. For a rock-solid
# uptime, an external monitor (e.g. UptimeRobot) pinging the same URL works too.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the OBSIDIAN API so Render does not sleep
        run: |
          for url in \
            "https://obsidian-abax.onrender.com/api/v1/auth/me" \
            "https://obsidiancloud.netlify.app/api/v1/auth/me"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "$url -> $code"
          done
