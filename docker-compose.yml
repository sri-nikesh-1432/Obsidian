# One-command deploy with no cloud account required:
#
#   docker compose up --build
#   open http://localhost:8080
#
# Optional integrations are read from the environment / a .env file:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   -> "Continue with Google" (all roles)
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
#   OBSIDIAN_SMTP_HOST, OBSIDIAN_SMTP_USERNAME, OBSIDIAN_SMTP_PASSWORD
#                                             -> real OTP email delivery
#   OBSIDIAN_STORAGE_BACKEND=r2 + OBSIDIAN_R2_* + OBSIDIAN_DOCUMENT_BUCKET
#                                             -> store documents in Cloudflare R2
#   OBSIDIAN_STORAGE_BACKEND=kv + OBSIDIAN_CF_ACCOUNT_ID +
#   OBSIDIAN_CF_API_TOKEN + OBSIDIAN_KV_NAMESPACE_ID
#                                             -> store documents in Workers KV
#                                             -> and persist the whole in-memory
#                                                database so it survives restarts
#   OBSIDIAN_PERSIST_INTERVAL=20              -> seconds between state write-backs
services:
  obsidian:
    build: .
    image: obsidian:latest
    ports:
      - "8080:8080"
    environment:
      OBSIDIAN_PUBLIC_BASE_URL: ${OBSIDIAN_PUBLIC_BASE_URL:-http://localhost:8080}
      OBSIDIAN_API_BASE_URL: ${OBSIDIAN_API_BASE_URL:-http://localhost:8080/api/v1}
      OBSIDIAN_ALLOWED_ORIGINS: ${OBSIDIAN_ALLOWED_ORIGINS:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      OBSIDIAN_SMTP_HOST: ${OBSIDIAN_SMTP_HOST:-}
      OBSIDIAN_SMTP_PORT: ${OBSIDIAN_SMTP_PORT:-587}
      OBSIDIAN_SMTP_USERNAME: ${OBSIDIAN_SMTP_USERNAME:-}
      OBSIDIAN_SMTP_PASSWORD: ${OBSIDIAN_SMTP_PASSWORD:-}
      OBSIDIAN_STORAGE_BACKEND: ${OBSIDIAN_STORAGE_BACKEND:-s3}
      OBSIDIAN_DOCUMENT_BUCKET: ${OBSIDIAN_DOCUMENT_BUCKET:-obsidian-documents-local}
      OBSIDIAN_R2_ENDPOINT: ${OBSIDIAN_R2_ENDPOINT:-}
      OBSIDIAN_R2_ACCESS_KEY_ID: ${OBSIDIAN_R2_ACCESS_KEY_ID:-}
      OBSIDIAN_R2_SECRET_ACCESS_KEY: ${OBSIDIAN_R2_SECRET_ACCESS_KEY:-}
      OBSIDIAN_R2_REGION: ${OBSIDIAN_R2_REGION:-auto}
      OBSIDIAN_CF_ACCOUNT_ID: ${OBSIDIAN_CF_ACCOUNT_ID:-}
      OBSIDIAN_CF_API_TOKEN: ${OBSIDIAN_CF_API_TOKEN:-}
      OBSIDIAN_KV_NAMESPACE_ID: ${OBSIDIAN_KV_NAMESPACE_ID:-}
      OBSIDIAN_PERSIST_STATE: ${OBSIDIAN_PERSIST_STATE:-}
      OBSIDIAN_PERSIST_INTERVAL: ${OBSIDIAN_PERSIST_INTERVAL:-20}
      OBSIDIAN_DEV_MODE: ${OBSIDIAN_DEV_MODE:-true}
    restart: unless-stopped
