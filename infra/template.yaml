AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  OBSIDIAN — secure student document vault. Serverless boundary: one HTTP API
  (API Gateway v2) routing every /api/v1 path to a single Lambda
  (obsidian.gateway.dispatch); 12 DynamoDB tables (SSE-KMS + PITR); a private
  KMS-encrypted S3 bucket holding ciphertext; a KMS CMK with rotation; a Secrets
  Manager secret for backend credentials (Google OAuth, Resend/SMTP, Razorpay,
  LLM); CloudWatch log retention and 429/5xx alarms.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Sets OBSIDIAN_ENV; production forces fail-closed defaults.
  LogRetentionInDays:
    Type: Number
    Default: 30
    Description: CloudWatch Logs retention for the API.
  DocumentBucketName:
    Type: String
    Default: obsidian-docs
    Description: Globally-unique name for the private document bucket.
  PublicBaseUrl:
    Type: String
    Default: "http://localhost:5173"
    Description: >-
      Public origin users reach the app at (CloudFront / custom domain). Drives
      the Google OAuth redirect URI, the post-login redirect and the CORS
      allow-list. It MUST match the Authorized origins / redirect URIs
      registered on the Google OAuth client, character for character.
  # Credentials are never given defaults in source. Pass them with
  # `--parameter-overrides` (or inject them into Secrets Manager directly) so
  # this repository carries no secrets at all.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >-
      Google OAuth 2.0 Client ID (a public identifier, not a secret).
      Required for "Continue with Google" on all four roles.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Google OAuth 2.0 Client Secret. Override at deploy time with
      --parameter-overrides or via Secrets Manager. Never commit this value.
  RazorpayKeyId:
    Type: String
    Default: ""
    Description: >-
      Razorpay publishable key id (also sent to the browser). Pass it with
      --parameter-overrides; test-mode ids begin with rzp_test_.
  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Razorpay key secret. Server-side only — never reaches the browser.
  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Secret configured on the Razorpay webhook endpoint (signature check).

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.13
    # x86_64 keeps `sam build` pip-only (no Docker required); switch to arm64
    # for Graviton pricing only if you build with a container runtime.

Resources:
  # ---------------------------------------------------------------- Secrets
  SecretsManagerSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: OBSIDIAN backend credentials (JSON keys mirror env names)
      # JSON keys mirror the backend env names; config.load_secrets() reads them
      # from here so no credential is ever placed in the function environment.
      SecretString: !Sub |
        {
          "GOOGLE_CLIENT_ID": "${GoogleClientId}",
          "GOOGLE_CLIENT_SECRET": "${GoogleClientSecret}",
          "RAZORPAY_KEY_ID": "${RazorpayKeyId}",
          "RAZORPAY_KEY_SECRET": "${RazorpayKeySecret}",
          "RAZORPAY_WEBHOOK_SECRET": "${RazorpayWebhookSecret}",
          "RESEND_API_KEY": "",
          "OBSIDIAN_SMTP_PASSWORD": "",
          "LLM_API_KEY": ""
        }

  # -------------------------------------------------------------------- KMS
  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for OBSIDIAN document encryption at rest
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Delegates full control to the account root, which lets IAM
          # policies in this account (the Lambda execution role) grant the
          # specific kms:Decrypt/Encrypt/GenerateDataKey* actions. Keeping the
          # key policy free of the role ARN avoids a CloudFormation dependency
          # cycle between the key and the function role.
          - Sid: AllowAccountAdminToManageTheKey
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  # -------------------------------------------------------------- S3 bucket
  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DocumentBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionCiphertextToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub "${DocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # -------------------------------------------------- DynamoDB (14 tables)
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "obsidian-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref KmsKey }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  ProfilesTable:
