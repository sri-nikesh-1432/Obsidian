  # ----------------------------------------------------------------- Lambda
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: obsidian.gateway.dispatch
      Description: OBSIDIAN API gateway (single handler for every /api/v1 route)
      Tracing: Active
      Layers: []
      Environment:
        Variables:
          OBSIDIAN_ENV: !Ref Environment
          OBSIDIAN_LOCAL_AWS: "false"
          OBSIDIAN_DEV_MODE: "false"
          OBSIDIAN_DEMO_SHOW_ERRORS: "false"
          OBSIDIAN_RELAX_RATE_LIMITS: "false"
          OBSIDIAN_COOKIE_SECURE: "true"
          OBSIDIAN_TABLE_PREFIX: obsidian
          OBSIDIAN_DOCUMENT_BUCKET: !Ref DocumentBucket
          OBSIDIAN_KMS_KEY_ID: !Ref KmsKey
          OBSIDIAN_SECRET_NAME: !Ref SecretsManagerSecret
          # Both URLs derive from the public origin so the Google redirect URI
          # (api_base_url + /auth/google/callback) is the deployed origin rather
          # than the localhost default, and CORS allows the real frontend.
          OBSIDIAN_PUBLIC_BASE_URL: !Ref PublicBaseUrl
          OBSIDIAN_API_BASE_URL: !Sub "${PublicBaseUrl}/api/v1"
          OBSIDIAN_ALLOWED_ORIGINS: !Ref PublicBaseUrl
          OBSIDIAN_MAX_UPLOAD_MB: "8"
          # Email: leave Resend unset and provide SMTP to deliver real OTPs.
          OBSIDIAN_SMTP_HOST: ""
          OBSIDIAN_SMTP_PORT: "587"
          OBSIDIAN_SMTP_USERNAME: ""
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obsidian-*"
                - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obsidian-*/index/*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource:
                - !GetAtt DocumentBucket.Arn
                - !Sub "${DocumentBucket.Arn}/*"
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: !GetAtt KmsKey.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerSecret
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ---------------------------------------------------- API Gateway (HTTP)
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "responseLatency":"$context.responseLatency"}

  # ---------------------------------------------------------- CloudWatch
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/httpapi/obsidian-${Environment}"
      RetentionInDays: !Ref LogRetentionInDays

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GatewayFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  Metric5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "obsidian-${Environment}-5xx"
      AlarmDescription: "HTTP 5xx errors -> check gateway/fail-closed posture"
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi

  Metric429:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "obsidian-${Environment}-rate-limited"
      AlarmDescription: "Rate limiter triggered (HTTP 429) -> possible brute force"
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi

Outputs:
  HttpApiEndpoint:
    Description: Base URL for the deployed vault API (call /api/v1/... under it)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt GatewayFunction.Arn
  DocumentBucket:
    Description: Private S3 bucket holding encrypted ciphertext
    Value: !Ref DocumentBucket
  KmsKeyArn:
    Description: CMK used for encryption at rest
    Value: !GetAtt KmsKey.Arn
  SecretsManagerSecretArn:
    Description: ARN of the credentials secret
    Value: !Ref SecretsManagerSecret
  GoogleRedirectUri:
    Description: >-
      Register this exact value as an Authorized redirect URI on the Google
      OAuth client (Authorized origin = the same PublicBaseUrl).
    Value: !Sub "${PublicBaseUrl}/api/v1/auth/google/callback"
