# Netlify deploy for the OBSIDIAN frontend.
#
#   netlify deploy --build --prod
#
# Netlify serves the static SPA only. The /api/v1/* route below is proxied
# (status 200) to the live OBSIDIAN backend on Render, so the browser stays
# same-origin and session cookies behave exactly as they do locally.
#
# The backend must list this Netlify origin in OBSIDIAN_ALLOWED_ORIGINS (it
# validates Origin on every state-changing request):
#   OBSIDIAN_ALLOWED_ORIGINS=https://obsidiancloud.netlify.app,https://obsidian-abax.onrender.com

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

# API proxy (must come before the SPA fallback — first match wins).
[[redirects]]
  from = "/api/v1/*"
  to = "https://obsidian-abax.onrender.com/api/v1/:splat"
  status = 200
  force = true

# SPA fallback — every client route renders index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
